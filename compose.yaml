# Local development stack.
#   docker compose up -d --build --wait               API (after migrations) + Postgres + Redis
#   docker compose --profile observability up -d      + Langfuse (http://localhost:3000)
# Dev-only credentials come from .env (copy .env.example). Never reuse them elsewhere.

name: staffroom

include:
  - infra/compose/langfuse.yaml

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-staffroom}
  REDIS_HOST: redis
  REDIS_PORT: "6379"  # container port, not the host mapping

services:
  # One-shot: applies Alembic migrations, then exits. The API starts only if it succeeded.
  migrate:
    image: staffroom-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Alembic for our tables, then LangGraph's own checkpoint tables (+ their RLS).
    command:
      - sh
      - -c
      - /app/.venv/bin/alembic -c apps/api/alembic.ini upgrade head && /app/.venv/bin/python -m staffroom_api.agents.checkpoints
    environment:
      <<: *db-env
      # Owner credentials: only the migration job gets these.
      POSTGRES_USER: ${POSTGRES_USER:-staffroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staffroom}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: staffroom-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *db-env
      # App role only: not the table owner, so row-level security applies.
      APP_DB_USER: ${APP_DB_USER:-staffroom_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-staffroom_app}
      # "fake:1" = deterministic fake model, 1 s per reply, so runs are watchable.
      STAFFROOM_MODEL: ${STAFFROOM_MODEL:-fake:1}
      # Tokens say iss=localhost:8080 (KC_HOSTNAME); keys are fetched over the compose network.
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/staffroom
      OIDC_JWKS_URL: http://keycloak:8080/realms/staffroom/protocol/openid-connect/certs
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    healthcheck:  # slim image has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Executes runs from the Taskiq queue (ADR-0004). Scale with --scale worker=N.
  worker:
    image: staffroom-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/taskiq", "worker", "staffroom_api.worker:broker"]
    restart: unless-stopped
    environment:
      <<: *db-env
      APP_DB_USER: ${APP_DB_USER:-staffroom_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-staffroom_app}
      STAFFROOM_MODEL: ${STAFFROOM_MODEL:-fake:1}
      RUN_SEGMENT_TIMEOUT_SECONDS: ${RUN_SEGMENT_TIMEOUT_SECONDS:-1800}
      REDELIVERY_AFTER_SECONDS: ${REDELIVERY_AFTER_SECONDS:-2100}
      # Employees' code runs in sandbox containers (ADR-0006), via the socket proxy only.
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-docker}
      SANDBOX_IMAGE: staffroom-sandbox:dev
      DOCKER_HOST: tcp://docker-proxy:2375
      # Tracing (ADR-0008): on when keys are set (.env); needs --profile observability.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      # Local models: Ollama runs natively on the host (GPU), not in Docker.
      # Use with STAFFROOM_MODEL=ollama:qwen3.5:4b
      OLLAMA_HOST: http://host.docker.internal:11434
      # Gemini (free tier): key only reaches the worker, never the API container.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MODEL_REQUESTS_PER_SECOND: ${MODEL_REQUESTS_PER_SECOND:-}
      STAFFROOM_FALLBACK_MODELS: ${STAFFROOM_FALLBACK_MODELS:-[]}
    extra_hosts:
      - host.docker.internal:host-gateway  # also works on Linux Docker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      sandbox-image:
        condition: service_completed_successfully

  # Builds the sandbox image, then exits. Containers from it are started by the worker.
  sandbox-image:
    image: staffroom-sandbox:dev
    build: ./sandbox
    command: ["true"]

  # Limits which Docker API calls the worker can make (ADR-0006). Still dev-grade:
  # creating containers is root-equivalent on the host. Production uses E2B.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EXEC: 1
      VOLUMES: 1
      IMAGES: 1
      ALLOW_START: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Identity provider (ADR-0003). Realm config is code: infra/keycloak/staffroom-realm.json,
  # imported on first start. Dev mode + embedded H2 store, persisted in a volume.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Fixed public URL, so token issuers match whether called from host or containers.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8080}:8080
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/staffroom-realm.json:/opt/keycloak/data/import/staffroom-realm.json:ro
    healthcheck:  # image has no curl; management port 9000 serves /health
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  postgres:
    image: docker.io/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staffroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staffroom}
      POSTGRES_DB: ${POSTGRES_DB:-staffroom}
      APP_DB_USER: ${APP_DB_USER:-staffroom_app}  # read by the init script
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-staffroom_app}
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staffroom} -d ${POSTGRES_DB:-staffroom}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/redis:7.4-alpine
    restart: unless-stopped
    command: ["--appendonly", "yes"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  keycloak_data:
  postgres_data:
  redis_data:
