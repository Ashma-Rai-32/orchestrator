# Local development stack.
#   docker compose up -d --build --wait               API (after migrations) + Postgres + Redis
#   docker compose --profile observability up -d      + Langfuse (http://localhost:3000)
# Dev-only credentials come from .env (copy .env.example). Never reuse them elsewhere.

name: staffroom

include:
  - infra/compose/langfuse.yaml

x-api-env: &api-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-staffroom}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staffroom}
  POSTGRES_DB: ${POSTGRES_DB:-staffroom}
  REDIS_HOST: redis
  REDIS_PORT: "6379"  # container port, not the host mapping

services:
  # One-shot: applies Alembic migrations, then exits. The API starts only if it succeeded.
  migrate:
    image: staffroom-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["/app/.venv/bin/alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: staffroom-api:dev
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: *api-env
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    healthcheck:  # slim image has no curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: docker.io/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staffroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staffroom}
      POSTGRES_DB: ${POSTGRES_DB:-staffroom}
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staffroom} -d ${POSTGRES_DB:-staffroom}"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: docker.io/redis:7.4-alpine
    restart: unless-stopped
    command: ["--appendonly", "yes"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
