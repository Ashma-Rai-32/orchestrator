# Virtual uv workspace root (see docs/adr/0002). Holds shared dev tooling only.
# packages/schemas joins `members` when it is created.

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "ruff>=0.16.10",
]

[tool.uv]
required-version = ">=0.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "S",        # bandit (security)
    "ASYNC",    # async pitfalls
    "RUF",
]

[tool.ruff.lint.flake8-bugbear]
# Framework dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["taskiq.TaskiqDepends", "fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["staffroom_api"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106"]  # asserts and throwaway test-container passwords

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^spikes/"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
