name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream publishes no floating v10 tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # gitleaks runs in its own job against full history; SKIP avoids a no-op staged scan here.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose --profile observability config --quiet

  office:
    name: Office UI builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/office
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/office/package-lock.json
      - run: npm ci
      - run: npm run build  # tsc --strict, then vite build

  spikes:
    name: Spike tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream publishes no floating v10 tag
        with:
          enable-cache: true
      # Each spike test is a PEP 723 script with its own pinned deps. Fake models only.
      - run: |
          for t in spikes/*/test_spike.py; do
            echo "::group::$t"
            uv run "$t"
            echo "::endgroup::"
          done

  test:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: staffroom
          POSTGRES_PASSWORD: staffroom
          POSTGRES_DB: staffroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U staffroom" --health-interval 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # upstream publishes no floating v10 tag
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: docker build -t staffroom-sandbox:dev sandbox/  # for sandbox backend tests
      - run: uv run pytest apps/api
      - run: uv run pytest experiments  # evaluator unit tests; no model or Langfuse needed

  api-image:
    name: API image builds and is healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait api
      - run: curl -fsS http://localhost:8000/health
