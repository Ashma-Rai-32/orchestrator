<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staffroom</title>
  </head>
  <body>
    <header>
      <strong>Staffroom</strong>
      <span id="company"></span>
      <button id="sign-out" type="button">Sign out</button>
    </header>
    <form id="goal-form">
      <input id="goal" name="goal" placeholder="What should your team build? e.g. an LLM wrapper website" required maxlength="2000" />
      <button type="submit">Start</button>
    </form>
    <section id="inbox" hidden>
      <h2>Inbox</h2>
      <ul id="inbox-items"></ul>
    </section>
    <div id="office"></div>
    <p id="status" role="status"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
