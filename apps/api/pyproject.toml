[project]
name = "staffroom-api"
version = "0.1.0"
description = "Staffroom backend: tenants, employees, goals, agent runs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.32.0",
    "redis>=8.1.0",
    "alembic>=1.20.0",
    "langchain>=1.4.3",
    "langgraph>=1.2.14",
    "langchain-anthropic>=1.7.5",  # provider packages are only used via init_chat_model
    "langchain-ollama>=1.1.0",  # local models (keyless, free)
    "langchain-google-genai>=4.4.0",  # Gemini (free tier via AI Studio key)
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",  # driver used by the LangGraph Postgres checkpointer
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "pyjwt[crypto]>=2.15.1",
    "deepagents>=0.7.22",
    "docker>=7.2.0",
    "langchain-mcp-adapters>=0.3.2",
    "langfuse>=4.17.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",  # Starlette's TestClient deprecated httpx in favour of httpx2
    "pytest-alembic>=0.13.1",
    "testcontainers[postgres]>=4.15.0",
    "psycopg[binary]>=3.3.6",  # sync driver for migration tests
    "types-docker>=7.2.0.20261006",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
