[project]
name = "staffroom-api"
version = "0.1.0"
description = "Staffroom backend: tenants, employees, goals, agent runs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "asyncpg>=0.32.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = ["httpx2>=2.13.1"]  # Starlette's TestClient deprecated httpx in favour of httpx2

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
